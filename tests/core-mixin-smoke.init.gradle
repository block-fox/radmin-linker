// Opt-in runtime check: gradlew -I tests/core-mixin-smoke.init.gradle runClient
allprojects {
    afterEvaluate {
        def smokeSources = file(project.minecraft_version.toString().startsWith('1.21.')
                ? '../../tests/mixin-smoke' : 'tests/mixin-smoke')
        def smokeClasses = layout.buildDirectory.dir('classes/mixin-smoke')
        def smokeMetadata = layout.buildDirectory.file('mixin-smoke/fabric.mod.json')
        def smokeWork = file('.tmp/core-mixin-smoke-runtime')
        def compileSmoke = tasks.register('compileCoreRoutingMixinSmoke', JavaCompile) {
            dependsOn tasks.named('classes')
            source = fileTree(smokeSources) { include '*.java' }
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = smokeClasses
            options.release = project.minecraft_version.toString().startsWith('1.21.') ? 21 : 25
        }
        def metadataSmoke = tasks.register('prepareCoreRoutingMixinSmoke') {
            outputs.file smokeMetadata
            doLast {
                def metadata = smokeMetadata.get().asFile
                metadata.parentFile.mkdirs()
                metadata.text = '''{"schemaVersion":1,"id":"radminlan_core_smoke","version":"1.0.0","environment":"client","entrypoints":{"client":["CoreRoutingMixinSmoke"]},"depends":{"radminlan":"*"}}'''
            }
        }
        def smokeJar = tasks.register('jarCoreRoutingMixinSmoke', Jar) {
            dependsOn compileSmoke, metadataSmoke
            archiveFileName = 'radminlan-core-mixin-smoke.jar'
            destinationDirectory = layout.buildDirectory.dir('mixin-smoke')
            from smokeClasses
            from smokeMetadata
        }
        tasks.named('runClient') {
            dependsOn smokeJar
            workingDir smokeWork
            jvmArgs "-Dfabric.addMods=${smokeJar.get().archiveFile.get().asFile.absolutePath}"
            doFirst {
                smokeWork.mkdirs()
                def run = java.nio.file.Files.createTempDirectory(smokeWork.toPath(), 'fresh-').toFile()
                workingDir(run)
                def clientArgs = new ArrayList(getArgs() ?: [])
                int gameDir = clientArgs.indexOf('--gameDir')
                if (gameDir >= 0) clientArgs[gameDir + 1] = run.absolutePath
                else clientArgs.addAll(['--gameDir', run.absolutePath])
                setArgs(clientArgs)
                def official = project.findProperty('smokeOfficial') == 'true'
                if (!official) {
                    def config = new File(run, 'config/radminlan.json')
                    config.parentFile.mkdirs()
                    config.text = groovy.json.JsonOutput.toJson([pipeName: '\\\\.\\pipe\\radminlan-smoke-' + UUID.randomUUID()])
                }
                systemProperty('radminlan.smokeOfficial', official.toString())
                systemProperty('radminlan.smokeDirectory', run.absolutePath)
            }
        }
    }
}
